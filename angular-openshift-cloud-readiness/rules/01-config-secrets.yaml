- ruleID: angular-ocp-sec-00001
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=angular
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=secrets
  description: Secretos / API keys embebidos en environment*.ts
  message: |
    Credenciales en src/environments/environment*.ts se compilán en el bundle JS
    y viajan a la imagen (SPA) o al artefacto SSR — no es Twelve-Factor.
    Remediacion: OpenShift Secret/ConfigMap + inyeccion runtime
    (assets/config.json + provideAppInitializer / APP_INITIALIZER, o envsubst
    en docker-entrypoint). Rota claves si llegaron a git.
    Nota: placeholders tipo "CHANGE_ME" pueden ser falso positivo — triagelo.
  when:
    builtin.filecontent:
      filePattern: ".*/environments/environment.*\\.ts$"
      pattern: "(?i)(apiKey|apiSecret|clientSecret|password|secret|privateKey|accessToken|authToken)\\s*[:=]\\s*['\"][^'\"]+['\"]"

- ruleID: angular-ocp-sec-00002
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=angular
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=secrets
  description: Secretos hardcodeados en codigo TypeScript/JavaScript
  message: |
    Literales con password/apiKey/Bearer en servicios o componentes acoplan
    secretos al bundle. Remediacion: config runtime + Secret de OpenShift;
    nunca literales en fuente ni en environment*.ts de produccion.
  when:
    builtin.filecontent:
      filePattern: ".*\\.(ts|js|mjs)$"
      pattern: "(?i)(apiKey|apiSecret|clientSecret|password|secretKey|privateKey)\\s*[:=]\\s*['\"][^'\"]{8,}['\"]|(Authorization\\s*[:=]\\s*['\"]Bearer\\s+[A-Za-z0-9._\\-]{12,})"

- ruleID: angular-ocp-cfg-00001
  category: potential
  effort: 1
  labels:
    - konveyor.io/source=angular
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=config
  description: environment.development.ts con secretos o endpoints locales
  message: |
    environment.development.ts no debe viajar a la imagen de produccion
    (.dockerignore / build solo production). Verifica que secretos y URLs de
    localhost no se empaqueten vía fileReplacements incorrectos.
  when:
    builtin.filecontent:
      filePattern: ".*/environments/environment\\.development\\.ts$"
      pattern: "(?i)((apiKey|password|secret|token)\\s*[:=]\\s*['\"][^'\"]+['\"]|(localhost|127\\.0\\.0\\.1))"
