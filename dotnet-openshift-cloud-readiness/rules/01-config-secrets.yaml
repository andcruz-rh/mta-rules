- ruleID: dotnet-ocp-sec-00001
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=dotnet
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=secrets
  description: Secretos o connection strings con password en appsettings
  message: |
    Credenciales embebidas en appsettings*.json no son Twelve-Factor ni cloud-ready.
    Remediacion: OpenShift Secret/ConfigMap + env vars; leer con IConfiguration
    (ConnectionStrings__Default, etc.). Rota secretos si llegaron a git.
    Nota: placeholders tipo "CHANGE_ME" pueden ser falso positivo — triagelo.
  when:
    builtin.filecontent:
      filePattern: ".*/appsettings.*\\.json$"
      pattern: "(?i)(\"(Password|Pwd|ClientSecret|ApiKey|ApiSecret|AccessKey|PrivateKey|ConnectionString)\"\\s*:\\s*\"[^\"]+\"|(Password|Pwd)\\s*=\\s*[^;\"'\\s]+)"

- ruleID: dotnet-ocp-sec-00002
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=dotnet
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=secrets
  description: Connection string / secreto hardcodeado en codigo C#
  message: |
    Literales con Password=/Server= o new SqlConnection("...") acoplán secretos al binario.
    Remediacion: IConfiguration / IOptions + variables de entorno; nunca literales en fuente.
  when:
    builtin.filecontent:
      filePattern: ".*\\.(cs|fs|vb)$"
      pattern: "(?i)((Sql|Npgsql|MySql|Oracle)?Connection\\s*\\([\\s\\S]{0,80}\"[^\"]*(Password|Pwd)\\s*=|(Password|Pwd|ClientSecret|ApiKey)\\s*=\\s*\"[^\"]+\")"

- ruleID: dotnet-ocp-cfg-00001
  category: potential
  effort: 2
  labels:
    - konveyor.io/source=dotnet
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=config
  description: ConfigurationManager / App.config estilo .NET Framework
  message: |
    ConfigurationManager.AppSettings / ConnectionStrings es patron Framework;
    en contenedores prioriza IConfiguration + env vars (ASPNETCORE_*, ConnectionStrings__).
    Remediacion: migrar a Microsoft.Extensions.Configuration y eliminar dependencia de App.config en runtime.
  when:
    builtin.filecontent:
      filePattern: ".*\\.(cs|fs|vb)$"
      pattern: "\\b(ConfigurationManager\\.(AppSettings|ConnectionStrings)|System\\.Configuration\\.ConfigurationManager)\\b"

- ruleID: dotnet-ocp-cfg-00002
  category: potential
  effort: 1
  labels:
    - konveyor.io/source=dotnet
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=config
  description: appsettings.Development.json con secretos o endpoints locales
  message: |
    appsettings.Development.json no debe viajar a la imagen de produccion (.dockerignore).
    Verifica que secretos/dev endpoints no se empaqueten en el publish.
  when:
    builtin.filecontent:
      filePattern: ".*/appsettings\\.Development\\.json$"
      pattern: "(?i)(\"(Password|Pwd|ClientSecret|ApiKey|ConnectionString)\"\\s*:\\s*\"[^\"]+\"|(localhost|127\\.0\\.0\\.1))"
