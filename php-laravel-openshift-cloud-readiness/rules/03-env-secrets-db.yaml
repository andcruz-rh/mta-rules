- ruleID: laravel-ocp-sec-00001
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=laravel
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=secrets
  description: APP_KEY / passwords presentes en .env
  message: |
    Secretos en archivos .env versionados o embebidos en imagen.
    Remediacion OpenShift: Secret + env/envFrom; .env solo en local/dev.
    Rota APP_KEY/DB_PASSWORD si llegaron a git.
    Nota: .env.example con placeholders puede ser falso positivo — triagelo.
  when:
    builtin.filecontent:
      filePattern: ".*\\.env.*"
      pattern: "(?i)^\\s*(APP_KEY|DB_PASSWORD|REDIS_PASSWORD|MAIL_PASSWORD|AWS_SECRET_ACCESS_KEY)\\s*=\\s*.+"

- ruleID: laravel-ocp-net-00001
  category: mandatory
  effort: 2
  labels:
    - konveyor.io/source=laravel
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=networking
  description: DB_HOST/REDIS_HOST en localhost
  message: |
    localhost dentro del pod no apunta al Service de MySQL/Postgres/Redis.
    Usa DNS del Service (p.ej. mysql:3306) via variables de entorno del Deployment.
  when:
    builtin.filecontent:
      filePattern: ".*\\.env.*"
      pattern: "(?i)^\\s*(DB_HOST|REDIS_HOST|MEMCACHED_HOST|MAIL_HOST)\\s*=\\s*(127\\.0\\.0\\.1|localhost)\\s*$"

- ruleID: laravel-ocp-cfg-00001
  category: potential
  effort: 1
  labels:
    - konveyor.io/source=laravel
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openshift
    - category=config
  description: .env.example con defaults no cloud-ready
  message: |
    Defaults de .env.example orientan mal el onboarding a OpenShift.
    Documenta valores cloud (redis, s3, service DNS) en el example o en un
    .env.openshift.example (sin secretos reales).
  when:
    builtin.filecontent:
      filePattern: ".*/\\.env\\.example$"
      pattern: "(?i)^\\s*(SESSION_DRIVER|CACHE_DRIVER|FILESYSTEM_DISK)\\s*=\\s*(file|local)\\s*$"
